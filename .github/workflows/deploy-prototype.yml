name: Deploy renderer prototype to Pages

on:
  push:
    branches: [main]
    paths:
      - 'prototype/**'
      - '.github/workflows/deploy-prototype.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: prototype
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.22.2
          cache: npm
          cache-dependency-path: prototype/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run unit tests
        run: npm run test
      - name: Build static site
        run: npm run build
      - name: Resolve Pages test URL
        id: pages-url
        shell: bash
        run: |
          repository_name="${GITHUB_REPOSITORY#*/}"
          if [[ "$repository_name" == *.github.io ]]; then
            pages_path="/"
          else
            pages_path="/$repository_name/"
          fi
          echo "url=http://127.0.0.1:4173$pages_path" >> "$GITHUB_OUTPUT"
      - name: Test production Pages base
        env:
          PLAYWRIGHT_BASE_URL: ${{ steps.pages-url.outputs.url }}
          PLAYWRIGHT_SERVER_URL: ${{ steps.pages-url.outputs.url }}
          PLAYWRIGHT_SERVER_COMMAND: npm run preview:pages
        run: npm run test:e2e -- --workers=1
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: prototype/dist
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
